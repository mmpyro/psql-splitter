[project]
name = "psql-splitter"
version = "0.1.0"
description = "A command-line tool to split large SQL files into smaller chunks based on size and SQL separators."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
psql-splitter = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
include = ["main.py"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
